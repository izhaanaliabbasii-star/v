name: Build Insights APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q insights-app.zip

      - uses: actions/setup-node@v4
        with:
          node-version-file: insights-app/.nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: insights-app
        run: yarn install --frozen-lockfile

      - name: Create .env
        working-directory: insights-app
        run: cp .env.example .env

      - name: Build release APK
        working-directory: insights-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Insights-apk
          path: insights-app/android/app/build/outputs/apk/release/*.apk
